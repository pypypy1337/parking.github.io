<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парковочный мониторинг</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23176b87'/%3E%3Cpath d='M10 24V8h7.4c3.6 0 6.1 2.2 6.1 5.6s-2.5 5.7-6.1 5.7h-3.2V24H10zm4.2-8.3h2.7c1.4 0 2.3-.8 2.3-2.1s-.9-2.1-2.3-2.1h-2.7v4.2z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
    <header class="app-header">
        <div>
            <h1>Парковочный мониторинг</h1>
            <p id="systemStamp">Состояние загружается</p>
        </div>
        <div class="header-actions">
            <div class="mode-tabs" role="tablist">
                <button class="mode-tab active" data-view="work" type="button">Работа</button>
                <button class="mode-tab" data-view="setup" type="button">Настройка</button>
            </div>
            <button class="button secondary" id="refreshButton" type="button">Обновить</button>
        </div>
    </header>

    <main>
        <section class="status-line" id="statusLine" aria-live="polite"></section>

        <section class="view active" id="workView">
            <div class="metrics-grid" id="metricsGrid"></div>
            <div class="work-grid">
                <section class="panel">
                    <div class="section-heading">
                        <h2>Видеопотоки</h2>
                    </div>
                    <div class="feed-grid" id="cameraFeeds"></div>
                </section>

                <aside class="panel">
                    <div class="section-heading">
                        <h2>Парковки</h2>
                    </div>
                    <div class="space-list" id="spaceList"></div>
                    <div class="space-detail" id="spaceDetail"></div>
                </aside>
            </div>
        </section>

        <section class="view" id="setupView">
            <div class="forms-grid">
                <form class="form-panel" id="cameraForm">
                    <h2>Камера</h2>
                    <label>
                        Название
                        <input name="name" autocomplete="off" required>
                    </label>
                    <label>
                        RTSP
                        <input name="rtsp_url" autocomplete="off" placeholder="rtsp://..." required>
                    </label>
                    <button class="button" type="submit">Добавить</button>
                </form>

                <form class="form-panel" id="spaceForm">
                    <h2>Парковка</h2>
                    <label>
                        Название
                        <input name="name" autocomplete="off" required>
                    </label>
                    <div class="checkbox-group" id="spaceCameraChoices"></div>
                    <button class="button" type="submit">Создать</button>
                </form>

                <form class="form-panel" id="settingsForm">
                    <h2>Калибровка</h2>
                    <label>
                        Интервал занятости, сек.
                        <input name="occupancy_interval_seconds" type="number" min="1" step="1" required>
                    </label>
                    <label>
                        YOLO модель
                        <input name="yolo_model" autocomplete="off">
                    </label>
                    <button class="button" type="submit">Сохранить</button>
                </form>
            </div>

            <div class="setup-grid">
                <aside class="panel setup-sidebar">
                    <div class="section-heading">
                        <h2>Область</h2>
                    </div>
                    <label>
                        Парковка
                        <select id="spaceSelect"></select>
                    </label>
                    <label>
                        Камера
                        <select id="cameraSelect"></select>
                    </label>
                    <div class="tool-row">
                        <button class="tool-button active" data-zone-kind="parking" type="button">P</button>
                        <button class="tool-button" data-zone-kind="forbidden" type="button">X</button>
                    </div>
                    <div class="zone-list" id="zoneList"></div>
                </aside>

                <section class="panel editor-panel">
                    <div class="section-heading">
                        <h2>Разметка</h2>
                    </div>
                    <div class="editor-viewport" id="editorViewport">
                        <img id="editorFrame" alt="Кадр камеры">
                        <div class="zone-layer" id="editorZones"></div>
                    </div>
                    <form class="zone-editor" id="zoneEditor">
                        <div class="zone-editor-empty">Зона не выбрана</div>
                        <div class="zone-editor-fields hidden" id="zoneEditorFields">
                            <label>
                                Тип
                                <select name="kind">
                                    <option value="parking">P</option>
                                    <option value="forbidden">X</option>
                                </select>
                            </label>
                            <label>
                                X
                                <input name="x" type="number" min="0" max="100" step="0.1">
                            </label>
                            <label>
                                Y
                                <input name="y" type="number" min="0" max="100" step="0.1">
                            </label>
                            <label>
                                Ширина
                                <input name="width" type="number" min="1" max="100" step="0.1">
                            </label>
                            <label>
                                Высота
                                <input name="height" type="number" min="1" max="100" step="0.1">
                            </label>
                            <div class="editor-actions">
                                <button class="button" type="submit">Сохранить</button>
                                <button class="button secondary" id="vehicleToggle" type="button">Авто</button>
                                <button class="button danger" id="deleteZone" type="button">Удалить</button>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
